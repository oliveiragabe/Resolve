
name: Flutter Web Build

on:
  push:
    branches:
      - main
    paths:
      - 'tads-es-2026-poo-web/apps/mobile/**'
      - '.github/workflows/flutter-web.yml'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: tads-es-2026-poo-web/apps/mobile

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Analisar código
        run: flutter analyze

      - name: Executar testes
        run: flutter test

      - name: Compilar Flutter Web
        run: flutter build web --release

      - name: Salvar arquivos compilados
        uses: actions/upload-artifact@v4
        with:
          name: resolve-web
          path: tads-es-2026-poo-web/apps/mobile/build/web/
          retention-days: 7
